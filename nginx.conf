# Example NGINX configuration for this project
# - Serves the built frontend (Vite `dist` output)
# - Proxies API and uploads to the Node backend (default port 5050)
# - Supports WebSocket proxying for socket.io
#
# Update `root` and `server_name` to match your deployment and enable SSL as needed.

worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  upstream backend_upstream {
    server 127.0.0.1:5050;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name example.com; # <--- change to your domain

    root /var/www/eventmanager/dist; # <--- change to your frontend build output path
    index index.html;

    # Serve static frontend files
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Node backend
    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 100M;
      proxy_read_timeout 90s;
    }

    # Proxy uploads (backend serves /uploads as static)
    location /uploads/ {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy websocket (socket.io)
    location /socket.io/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400;
    }

    # Caching for static assets (adjust as needed)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # Optional: health check
    location = /health {
      proxy_pass http://backend_upstream/api/health;
    }
  }

  # Example SSL server block (use certbot or your certs)
  # server {
  #   listen 443 ssl;
  #   server_name example.com;
  #   ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  #   include /etc/letsencrypt/options-ssl-nginx.conf;
  #   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  #   root /var/www/eventmanager/dist;
  #   index index.html;
  #   ... (same locations as above)
  # }
}
